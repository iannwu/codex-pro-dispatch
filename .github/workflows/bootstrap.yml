name: Bootstrap source

on:
  push:
    branches:
      - codex/v0.1-poc

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/codex-pro-dispatch.tar.xz
          tar -xJf /tmp/codex-pro-dispatch.tar.xz -C .
      - name: Remove one-time bootstrap material
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          chmod +x bin/pro-dispatch bin/cgpt-* install.sh uninstall.sh
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement native Pro dispatch POC"
          git push origin HEAD:codex/v0.1-poc
      - name: Start macOS CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref codex/v0.1-poc
