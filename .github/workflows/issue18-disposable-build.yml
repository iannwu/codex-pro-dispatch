name: Issue 18 disposable build

on:
  push:
    branches: [codex/issue-18-delivery-status]

permissions:
  contents: write

concurrency:
  group: issue18-disposable-build
  cancel-in-progress: false

jobs:
  patch-and-test:
    if: github.repository == 'iannwu/codex-pro-dispatch' && github.ref == 'refs/heads/codex/issue-18-delivery-status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Assemble the pinned accepted patch and commit the test candidate
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          source = subprocess.check_output([
              "git", "show", "c1858ea6946dd0fee554a88e49fe92c7640ee0e1:.github/workflows/issue18-disposable-build.yml"
          ])
          assert hashlib.sha1(b"blob " + str(len(source)).encode() + b"\0" + source).hexdigest() == "b23bd1f1170b870b17122cd6e3a3dcf017c6042c"
          block = source.decode().split("          python3 - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          assert all(not line or line.startswith("          ") for line in block.splitlines())
          builder = "\n".join(line[10:] for line in block.splitlines()) + "\n"
          anchor = 'exec(compile(script, "issue18-pinned-builder", "exec"), {})'
          assert builder.count(anchor) == 1
          corrections = '''for before, after in (
              ("c80c856d992780a9f4ba2e88c9ce920c1a7a0f89", "c80c0bbbbc0b28590c3d59f878d1ff8f6e7426ca"),
              ("564b94e8021c0855f6c7c70a43e1b2860d7898e6", "296cd81146dbee3a8ce7c5a64a77bfdc61017ae6"),
              ('assert blob(new_test.encode()) == "dc0e3dd602aefadff123a49ad03f36fc00e97008"',
               'compile(new_test, "tests/test_outbound_delivery.py", "exec")'),
          ):
              assert script.count(before) == 1
              script = script.replace(before, after, 1)
          exec(compile(script, "issue18-pinned-builder", "exec"), {})'''
          builder = builder.replace(anchor, corrections)
          exec(compile(builder, "issue18-assembly", "exec"), {})
          PY
      - name: Test the committed candidate without native sends
        run: |
          set +e
          python3 -m unittest discover -s tests -v
          python_status=$?
          node --test tests/*.mjs tests/*.cjs
          node_status=$?
          set -e
          echo "PYTHON_EXIT=$python_status NODE_EXIT=$node_status CANDIDATE=$CANDIDATE_SHA"
          test "$python_status" = 0
          test "$node_status" = 0
          python3 -m py_compile bin/pro-dispatch skills/codex-pro-dispatch/scripts/pro-dispatch src/codex_pro_dispatch/*.py
          bash -n install.sh uninstall.sh
          ./bin/pro-dispatch --help
          git diff --exit-code HEAD --
      - name: Fast-forward only the authorized disposable branch
        run: |
          test "$GITHUB_REPOSITORY" = iannwu/codex-pro-dispatch
          test "$GITHUB_REF" = refs/heads/codex/issue-18-delivery-status
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          git push origin "HEAD:$GITHUB_REF"
