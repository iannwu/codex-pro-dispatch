name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Python syntax
        run: python3 -m py_compile bin/pro-dispatch $(find lib/codex_pro_dispatch -name '*.py' -print)

      - name: Shell syntax
        run: bash -n install.sh uninstall.sh

      - name: Swift helper typecheck
        run: |
          for file in bin/cgpt-*; do
            echo "Typechecking $file"
            swiftc -frontend -typecheck "$file"
          done

      - name: CLI help
        run: ./bin/pro-dispatch --help

      - name: Record successful branch verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v0.1-poc'
        env:
          VERIFIED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p verification
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "status": "passed",
              "verified_sha": os.environ["VERIFIED_SHA"],
              "workflow": "CI",
              "run_id": os.environ["RUN_ID"],
              "runner": "macos-latest",
              "python": "3.11",
          }
          Path("verification/ci.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/ci.json
          git commit -m "ci: attest ${VERIFIED_SHA:0:12}"
          git push origin HEAD:codex/v0.1-poc
