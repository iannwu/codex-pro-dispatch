name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Python syntax
        run: python3 -m py_compile bin/pro-dispatch $(find lib/codex_pro_dispatch -name '*.py' -print)

      - name: Shell syntax
        run: bash -n install.sh uninstall.sh

      - name: Swift helper typecheck
        run: |
          for file in bin/cgpt-*; do
            echo "Typechecking $file"
            temp="$RUNNER_TEMP/$(basename "$file").swift"
            cp "$file" "$temp"
            swiftc -typecheck "$temp"
          done

      - name: CLI help
        run: ./bin/pro-dispatch --help
